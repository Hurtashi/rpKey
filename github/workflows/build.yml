name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unpack project zip (if uploaded as RpKeyboard.zip)
        run: |
          if [ -f RpKeyboard.zip ]; then rm -rf RpKeyboard && unzip -oq RpKeyboard.zip; fi
      - name: Build debug APK
        run: cd RpKeyboard && gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RpKeyboard-apk
          path: RpKeyboard/app/build/outputs/apk/debug/app-debug.apk
