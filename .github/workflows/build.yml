
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ls -la
          unzip -l RpKeyboard.zip

      - name: Unpack project
        run: |
          mkdir -p RpKeyboard
          unzip -oq RpKeyboard.zip -d RpKeyboard

      - name: Find project files
        run: |
          find . -maxdepth 8 -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          \) -print
