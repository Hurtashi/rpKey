
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unpack project
        run: |
          mkdir -p RpKeyboard
          unzip -oq RpKeyboard.zip -d RpKeyboard

      - name: Build APK
        run: |
          cd RpKeyboard/RpKeyboard
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RpKeyboard-apk
          path: RpKeyboard/RpKeyboard/app/build/outputs/apk/debug/app-debug.apk
